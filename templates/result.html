<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff512f, #dd2476);
            margin: 0;
            padding: 0;
            text-align: center;
            color: white;
        }

        .result-box {
            margin-top: 100px;
            background: white;
            color: black;
            display: inline-block;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 8px 15px rgba(0,0,0,0.3);
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="result-box">
    <h2>Predicted Bill for {{ month }}/{{ year }}</h2>
    <h1>₹{{ new_bill }}</h1>
    <a href="/">Go Back</a>
</div>

</body>
</html>
