<!DOCTYPE html>
<html>
<head>
    <title>AI Smart Energy Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial; background:#f4f6f9; margin:0; }
        header { background:#1f2937; color:white; padding:20px; text-align:center; }
        .container { max-width:1100px; margin:auto; padding:30px; }
        .card {
            background:white;
            padding:20px;
            margin-bottom:25px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }
        canvas { height:350px !important; }
        button {
            background:#2563eb;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:6px;
            cursor:pointer;
        }
        button:hover { background:#1e40af; }
    </style>
</head>
<body>

<header>
    <h1>AI Smart Home Energy Dashboard</h1>
</header>

<div class="container">

    <div class="card">
        <h2>Overall Energy Analysis</h2>
        <select id="overall-period">
            <option value="hourly">Hourly</option>
            <option value="daily" selected>Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
        </select>
        <button onclick="loadOverall()">Load</button>
        <canvas id="overallChart"></canvas>
    </div>

    <div class="card">
        <h2>Device-Level Analysis</h2>
        <select id="device-select"></select>
        <select id="device-period">
            <option value="hourly">Hourly</option>
            <option value="daily" selected>Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
        </select>
        <button onclick="loadDevice()">Load</button>
        <canvas id="deviceChart"></canvas>
    </div>

    <div class="card">
        <h2>Next Hour Prediction</h2>
        <button onclick="predict()">Predict</button>
        <p id="predictionResult"></p>
    </div>

    <div class="card">
        <h2>All Device Prediction (Pie)</h2>
        <button onclick="predictAll()">Generate</button>
        <canvas id="pieChart"></canvas>
    </div>

    <div class="card">
        <h2>Energy Insights</h2>
        <p id="insightText"></p>
    </div>

</div>

<script>
let overallChart, deviceChart, pieChart;

async function loadAppliances() {
    const res = await fetch("/api/appliances");
    const data = await res.json();
    const select = document.getElementById("device-select");
    select.innerHTML = "";
    data.appliances.forEach(device => {
        let opt = document.createElement("option");
        opt.value = device;
        opt.textContent = device;
        select.appendChild(opt);
    });
}

async function loadOverall() {
    const period = document.getElementById("overall-period").value;
    const res = await fetch(`/api/overall?period=${period}`);
    const data = await res.json();
    const ctx = document.getElementById("overallChart");

    if (overallChart) overallChart.destroy();

    overallChart = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.labels,
            datasets: [{
                label: "Energy Consumption (kWh)",
                data: data.values,
                borderColor: "#2563eb",
                fill: true
            }]
        }
    });
}

async function loadDevice() {
    const device = document.getElementById("device-select").value;
    const period = document.getElementById("device-period").value;
    if (!device) return;

    const res = await fetch(`/api/device?device=${device}&period=${period}`);
    const data = await res.json();
    const ctx = document.getElementById("deviceChart");

    if (deviceChart) deviceChart.destroy();

    deviceChart = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.labels,
            datasets: [{
                label: device,
                data: data.values,
                borderColor: "#16a34a",
                fill: true
            }]
        }
    });
}

async function predict() {
    const device = document.getElementById("device-select").value;
    if (!device) return;

    const res = await fetch("/api/predict", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({device})
    });

    const data = await res.json();
    document.getElementById("predictionResult").innerText =
        `Next Hour Prediction for ${data.device}: ${data.prediction.toFixed(2)} kWh`;
}

async function predictAll() {
    const res = await fetch("/api/predict_all");
    const data = await res.json();
    const ctx = document.getElementById("pieChart");

    if (pieChart) pieChart.destroy();

    pieChart = new Chart(ctx, {
        type: "pie",
        data: {
            labels: Object.keys(data),
            datasets: [{
                data: Object.values(data)
            }]
        }
    });
}

async function loadInsights() {
    const res = await fetch("/api/insights");
    const data = await res.json();

    document.getElementById("insightText").innerHTML =
        `<strong>${data.highest_device}</strong> consumes highest energy (${data.highest_value.toFixed(2)} kWh). 
        <br><br>
        Suggestion: Try reducing usage during peak hours.`;
}

window.onload = async function() {
    await loadAppliances();
    await loadOverall();
    await loadInsights();
};
</script>

</body>
</html>
